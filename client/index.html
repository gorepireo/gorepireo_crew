<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1725a3" />
    <meta name="description" content="Go_Repireo Crew - Centralized Workforce Management Platform with GPS Attendance, Teams, and Work Assignments" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Go_Repireo Crew — Workforce Management Platform</title>

    <script>
      // 1. Direct path to HashRouter translator (e.g. /login -> /#/login)
      (function() {
        var pathname = window.location.pathname;
        if (pathname && pathname !== '/' && !window.location.hash) {
          window.location.replace('/#' + pathname + window.location.search);
        }
      })();

      // 2. Proactively clear legacy caches from older builds to prevent stale white-screen bugs
      (function() {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              if (key === 'workcrew-v1' || key === 'workcrew-v2' || key === 'workcrew-v3') {
                caches.delete(key);
              }
            });
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen">
    <div id="root">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #f4f7ff 0%, #ffffff 55%, #eaf1ff 100%); color: #0f172a; font-family: 'Inter', system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="position: relative; width: 76px; height: 76px; border-radius: 22px; background: #0f172a; border: 3px solid #ffffff; box-shadow: 0 14px 32px rgba(16, 110, 232, 0.18); overflow: hidden; display: flex; align-items: center; justify-content: center; animation: workcrew-float 1.8s ease-in-out infinite;">
          <img src="/logo.png" alt="Go_Repireo Crew" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <div style="margin-top: 18px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; color: #0f172a;">Go_Repireo Crew</div>
        <div style="margin-top: 14px; width: 132px; height: 4px; border-radius: 999px; background: #e2e8f0; overflow: hidden;">
          <div style="width: 56px; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #106ee8, #38bdf8); animation: workcrew-bar 1.1s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes workcrew-bar { 0% { transform: translateX(-56px); } 100% { transform: translateX(132px); } }
        @keyframes workcrew-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            reg.onupdatefound = function() {
              var installing = reg.installing;
              if (installing) {
                installing.onstatechange = function() {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version found, reloading...');
                    window.location.reload();
                  }
                };
              }
            };
          }).catch(function(err) {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
